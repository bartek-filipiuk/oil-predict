name: refresh
on:
  schedule:
    # UTC. Cron ignores daylight saving, so each slot sits behind the thing that moves the numbers in either season.
    - cron: "15 5 * * *"    # Orlen list is in the API by ~05:00: score yesterday, first forecast for tomorrow
    - cron: "30 8 * * 1-5"  # Europe open
    - cron: "30 11 * * 1-5" # NBP mid rate (11:15) published
    - cron: "30 14 * * 1-5" # US open, EIA stocks on Wednesdays
    - cron: "30 17 * * 1-5" # last look before the settlements
    - cron: "0 20 * * *"    # after the 14:30 New York ULSD settlement all year; this forecast gets scored tomorrow
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python fetch.py
      - run: uv run python govmax.py
      - run: uv run python test_model.py
      - name: Ledger
        run: uv run python ledger.py
      - name: AI events
        env: { OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}", OPENROUTER_MODEL: google/gemini-3.8-flash }
        run: uv run python events.py
      - name: Build (pre-flight, Coolify rebuilds the same thing in Docker)
        run: uv run python build.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data.json site/events.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u '+%F %H:%M')"
          git push
