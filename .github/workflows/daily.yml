name: refresh
on:
  schedule:
    - cron: "40 5 * * *"    # 07:40 CEST morning: Orlen list is out -> score yesterday, new forecast, AI events
    - cron: "45 18 * * 1-5" # 20:45 CEST evening: markets closed -> refresh forecast with today's Brent/FX
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python fetch.py
      - run: uv run python govmax.py
      - run: uv run python test_model.py
      - name: Ledger
        run: uv run python ledger.py --run $([ "$(date -u +%H)" -lt 12 ] && echo morning || echo evening)
      - name: AI events
        env: { OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}", OPENROUTER_MODEL: google/gemini-3.8-flash }
        run: uv run python events.py
      - name: Build (pre-flight, Coolify rebuilds the same thing in Docker)
        run: uv run python build.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data.json site/events.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u '+%F %H:%M')"
          git push
      - name: Deploy to Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          [ -n "$COOLIFY_APP_UUID" ] || { echo "Coolify secrets not set, skipping deploy"; exit 0; }
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID"
